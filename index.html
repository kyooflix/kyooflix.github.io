<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYOOFLIX</title>
<meta name="description" content="11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.">
<meta property="og:title" content="KYOOFLIX">
<meta property="og:description" content="11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.">
<meta property="og:image" content="https://kyooflix.github.io/thumbs/main.jpg">
<meta property="og:url" content="https://kyooflix.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a birthday streaming service, polished like a shipped app, warm not cold
   IDEA: an OTT home screen whose whole catalogue is one actor's birthday
   PICTURE: full-bleed hero "now playing" with rows of posters below
   COLOUR and TYPE: near-black ground, kyoo-pink accent; Black Han Sans logo, IBM Plex Sans KR, Gowun Batang titles
   LAYOUT: fixed top bar, hero 70vh, horizontal snap rows, detail sheet and full-screen player */
:root{color-scheme:dark;--bg:#0b0a0c;--panel:#18161a;--ink:#f5f2f3;--soft:#a8a2a6;--rose:#f2c14e;--gold:#ffd27a}
*{box-sizing:border-box;min-width:0}
body{margin:0;word-break:keep-all;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,label:focus-within{outline:2px solid var(--rose);outline-offset:3px}
.hidden{display:none!important}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;animation:introOut .6s 2.1s forwards}
#intro .logo{font:400 clamp(64px,16vw,160px)/1 "Bebas Neue",sans-serif;color:var(--rose);letter-spacing:.02em;text-shadow:0 0 40px #f2c14e55;animation:logoIn 1.8s ease both}
#intro .logo span{color:var(--ink)}
@keyframes logoIn{0%{opacity:0;transform:scale(.8);filter:blur(10px)}50%{opacity:1;filter:none}100%{transform:scale(1.08)}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

/* top bar */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:24px;padding:14px max(4vw,16px);background:linear-gradient(rgba(11,10,12,.85),transparent);transition:background .3s}
header.solid{background:rgba(11,10,12,.97)}
.brand{font:400 34px/1 "Bebas Neue",sans-serif;letter-spacing:.02em;color:var(--rose);flex:none}.brand span{color:var(--ink)}
nav{display:flex;gap:18px;font-size:14px;color:var(--soft);overflow-x:auto;scrollbar-width:none}
nav a{color:inherit;text-decoration:none;white-space:nowrap}nav a.on{color:var(--ink);font-weight:700}
.me{margin-left:auto;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--rose),var(--gold));flex:none}

/* hero */
.hero{position:relative;height:min(78vh,720px);min-height:460px;display:flex;align-items:flex-end;padding:0 max(4vw,16px) clamp(40px,8vh,90px);overflow:hidden}
.hero .media{position:absolute;inset:0}
.hero video{width:100%;height:100%;object-fit:cover}
.hero .art{position:absolute;inset:-10%;background:radial-gradient(circle at 70% 40%,#f2c14e33,transparent 40%),radial-gradient(circle at 30% 70%,#ffffff12,transparent 45%),linear-gradient(120deg,#141416,#2a292e 45%,#0b0a0c);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg)),linear-gradient(90deg,rgba(11,10,12,.85),transparent 60%);pointer-events:none}
.hero .info{position:relative;z-index:1;max-width:560px}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero h1{letter-spacing:-.03em;font:900 clamp(36px,7vw,64px)/1.05 "Noto Sans KR",sans-serif;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0 0 20px;color:#e6d6d0;max-width:46ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:10px 22px;border-radius:6px;border:0;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.play{background:var(--ink);color:var(--bg)}
.btn.more{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.rate{position:absolute;right:0;bottom:clamp(40px,8vh,90px);z-index:1;display:flex;align-items:center;gap:12px}.mute{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff66;background:transparent}.age{background:#ffffff1f;border-left:3px solid var(--ink);padding:6px 28px 6px 10px;font-size:14px}
.jj{padding:10px 16px}.jj.on{background:var(--rose);color:var(--bg)}
.eps{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid #ffffff1a}.eps li{display:grid;grid-template-columns:28px 120px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff1a;cursor:pointer}.eps .no{font-size:22px;color:var(--soft);text-align:center}.eps .th{aspect-ratio:16/9;border-radius:4px}.eps b{display:block;font-size:15px}.eps small{color:var(--soft)}
@media(max-width:600px){.eps li{grid-template-columns:22px 90px 1fr}}
#who{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;animation:fadein .4s 2.2s both}
@keyframes fadein{from{opacity:0}}
#who h2{font-size:clamp(26px,5vw,44px);font-weight:500;margin:0}
.profs{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vw,28px)}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--soft);font-size:15px}
.prof i{display:grid;place-items:center;width:clamp(84px,14vw,140px);aspect-ratio:1;border-radius:8px;font:500 clamp(28px,4.5vw,44px)/1 "Noto Sans KR",system-ui,sans-serif;color:#fff;border:3px solid transparent;transition:border-color .15s}
.prof:hover,.prof:focus-visible{color:var(--ink)}.prof:hover i,.prof:focus-visible i{border-color:var(--ink)}

/* rows */
.rows{position:relative;z-index:2;margin-top:-40px;padding-bottom:60px}
.row{margin-bottom:34px}
.row h2{font-size:20px;margin:0 0 10px;padding:0 max(4vw,16px)}
.rail{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 max(4vw,16px);padding:6px max(4vw,16px) 12px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:clamp(240px,31vw,420px);aspect-ratio:16/9;border-radius:8px;scroll-snap-align:start;position:relative;overflow:hidden;border:0;padding:0;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:scale(1.05);box-shadow:0 12px 30px #0009;z-index:2}
.card .t{position:absolute;left:10px;right:10px;bottom:8px;font-weight:700;font-size:14px;line-height:1.3;text-shadow:0 1px 6px #000a}
.card .ep{position:absolute;left:10px;top:8px;font-size:12px;color:#fff;background:#0007;padding:2px 7px;border-radius:4px}
.card .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--rose)}
.top .card{width:clamp(250px,34vw,440px);display:flex;align-items:stretch;background:none!important}
.top .num{font:700 clamp(90px,13vw,150px)/.8 "Noto Sans KR",sans-serif;color:var(--bg);-webkit-text-stroke:2px #8c7279;align-self:flex-end;margin-right:-14px;position:relative;z-index:1}
.top .poster{flex:1;border-radius:8px;position:relative;overflow:hidden;aspect-ratio:2/3;max-width:60%}
.arrow{position:absolute;top:6px;bottom:12px;width:max(4vw,40px);border:0;background:rgba(11,10,12,.6);font-size:28px;z-index:3;opacity:0;transition:opacity .2s}
.rail:hover .arrow,.arrow:focus-visible{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}

/* detail sheet */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;overflow-y:auto}
.sheet{width:min(760px,100%);background:var(--panel);border-radius:12px;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
.sheet .cover{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:24px}
.sheet .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--panel))}
.sheet .cover>*{position:relative;z-index:1}
.sheet h3{letter-spacing:-.02em;font:900 clamp(26px,5vw,40px)/1.1 "Noto Sans KR",sans-serif;margin:0 0 14px}
.sheet .body{padding:4px 24px 26px}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--soft);margin-bottom:10px}
.meta b{color:#7ee0a0}
.x{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:#000a;font-size:20px}
.upl{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:6px;border:1px dashed #ffffff55;font-size:14px;color:var(--soft);cursor:pointer;position:relative}
.upl input{position:absolute;opacity:0;width:1px;height:1px}

/* player */
#player{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center}
#player video,#player iframe{width:100%;height:100%;object-fit:contain;border:0}
#player .ytout{position:absolute;top:16px;right:16px;z-index:2;min-height:44px;display:inline-flex;align-items:center;padding:8px 16px;border-radius:6px;background:#ffffff22;color:var(--ink);text-decoration:none;font-size:14px}
#player .empty{text-align:center;color:var(--soft);padding:20px}
#player .empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
#player .back{position:absolute;top:16px;left:16px;z-index:2;min-height:44px;padding:8px 16px;border-radius:6px;border:0;background:#ffffff22}
footer{padding:20px max(4vw,16px) 40px;color:var(--soft);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#intro{display:none}}
@media (max-width:600px){header{gap:14px}.hero{min-height:420px}.arrow{display:none}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="logo">KYOO<span>FLIX</span></div></div>

<div id="who" role="dialog" aria-label="프로필 선택">
  <h2>누구로 볼까요?</h2>
  <div class="profs">
    <button class="prof" data-c="#f2c14e"><i data-s="kyoo" style="background:linear-gradient(135deg,#c8902a,#f2c14e)"></i>뀨</button>
    <button class="prof" data-c="#8fe0b0"><i data-s="gift" style="background:linear-gradient(135deg,#2fa36b,#8fe0b0)"></i>290</button>
    <button class="prof" data-c="#b9a3ff"><i data-s="fan" style="background:linear-gradient(135deg,#6c4fd0,#b9a3ff)"></i>뀨러기</button>
    <button class="prof" data-c="#7fb8ff"><i data-s="cake" style="background:linear-gradient(135deg,#3d7be0,#7fb8ff)"></i>규자보이</button>
  </div>
</div>

<header id="top">
  <div class="brand">KYOO<span>FLIX</span></div>
  <nav><a class="on" href="#">홈</a><a href="#">시리즈</a><a href="#">필모그래피</a><a href="#">비하인드</a><a href="#">내가 찜한 영상</a></nav>
  <button class="me" aria-label="프로필 바꾸기" style="border:0;cursor:pointer;padding:0"></button>
</header>

<section class="hero">
  <div class="media" id="heroMedia"><div class="art"></div></div>
  <div class="info">
    <div class="tag">KYOOFLIX 오리지널 · 생일 특집</div>
    <h1 id="heroTitle">Happy Birthday,<br>이규형</h1>
    <p id="heroDesc">11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.</p>
    <div class="acts">
      <button class="btn play" id="heroPlay">▶ 재생</button>
      <button class="btn more" id="heroMore">ⓘ 상세 정보</button>
      <button class="btn more jj" data-id="v0" aria-label="찜하기">＋</button>
    </div>
  </div>
  <div class="rate"><button class="mute" id="mute" aria-label="소리 켜기">🔇</button><span class="age">ALL</span></div>
</section>

<div class="rows" id="rows"></div>
<footer>Made by 뀨러기 · 배우 이규형 생일 축하 비공식 팬메이드 페이지</footer>

<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div id="player" class="hidden"><button class="back" id="back">← 뒤로</button><div id="pbody"></div></div>

<script>
{
const hues = [18,210,38,265,170,25,195,45,230,12];
let n = 0;
function file(title, ep, desc, len, src, thumb){ return {id:'v'+(n++), title, ep, desc, len, src, thumb, hue:hues[n%hues.length]}; }
function yt(url, title){
  const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  const y = m ? m[1] : '';
  return {id:'v'+(n++), title, ep:'YouTube', desc:'', len:'', yt:y, thumb: y?`https://i.ytimg.com/vi/${y}/hqdefault.jpg`:'', hue:hues[n%hues.length]};
}
// ============================================================
//  여기만 고치면 돼요 ✏️
//  내 영상: file('제목','회차','설명','길이','videos/파일.mp4','thumbs/썸네일.jpg')
//  유튜브:  yt('유튜브 링크','제목')   ← 링크만 붙여넣으면 썸네일은 자동
// ============================================================

// ── 공통 메인 영상 (모든 프로필 맨 위)
const HERO = file('Happy Birthday, 이규형','메인','11월 29일 특별 편성 메인 영상.','1분','videos/main.mp4','thumbs/main.jpg');

// ── 내 영상 파일들
const FACE = [1,2,3,4,5].map(i=>file('얼굴 하이라이트 0'+i,'작품 '+i,'작품 이름과 한 줄 설명을 적어주세요.','30초',`videos/face${i}.mp4`,`thumbs/face${i}.jpg`));
const KYURAL = [1,2,3,4,5].map(i=>file('오늘의 뀨랄 0'+i,'뀨랄 '+i,'어떤 장면인지 한 줄 설명.','20초',`videos/kyural${i}.mp4`,`thumbs/kyural${i}.jpg`));
const EDITS = [1,2,3,4,5].map(i=>file('에딧 0'+i,'EDIT '+i,'에딧 설명을 적어주세요.','1분',`videos/edit${i}.mp4`,`thumbs/edit${i}.jpg`));
const CLIPS = [1,2,3,4,5].map(i=>file('방송 편집 0'+i,'CLIP '+i,'어떤 방송인지 한 줄 설명.','1분',`videos/clip${i}.mp4`,`thumbs/clip${i}.jpg`));

// ── 프로필별 홈 화면 (줄 이름과 영상 목록)
const PROFILES = {
  // 🐈‍⬛ 뀨
  kyoo: [
    {name:'이어서 시청하기', items:[FACE[0],KYURAL[1],EDITS[2],FACE[3]], progress:[62,30,80,45]},
    {name:'오늘의 TOP 5', top:true, items:[HERO,KYURAL[0],FACE[1],EDITS[0],KYURAL[2]]},
    {name:'이규형 얼굴 하이라이트', items:FACE},
    {name:'회원님을 위해 엄선한 오늘의 뀨랄', items:KYURAL},
    {name:'돌아와요 규형이형', items:[
      yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04'), yt('','영상 05'),
    ]},
  ],
  // 🐟 뀨러기
  fan: [
    {name:'회원님을 위해 엄선한 오늘의 콘텐츠', items:CLIPS},
    {name:'전 세계 에딧이 다 모였다!', items:EDITS},
  ],
  // 🎂 11월 (소속사 공식 영상)
  cake: [
    {name:'딱 한 편만 보려고 했는데!', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
    {name:'언제나 사랑받는 비하인드', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
    {name:'화보 촬영장의 세계', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
  ],
  // 🎁 29일 (작품별 추천)
  gift: [
    {name:'정세훈(님)이 찜한 리스트', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
    {name:'노착희 추천! 좌시백 관찰 일지', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
    {name:'슬기로운 도련생활(와)과 비슷한 콘텐츠', items:[ yt('','영상 01'), yt('','영상 02'), yt('','영상 03'), yt('','영상 04') ]},
  ],
};
// ============================================================
let PROFILE = 'kyoo';
// 이어보기·TOP 5가 없는 프로필은 그 프로필 영상으로 자동으로 채워줌
const autoRows = rows => {
  if(rows.some(r=>r.top)) return rows;
  const pool = []; const max = Math.max(0, ...rows.map(r=>r.items.length));
  for(let i=0;i<max;i++) rows.forEach(r=>{ if(r.items[i]) pool.push(r.items[i]); });
  const cont = pool.slice(0,4), top = [HERO, ...pool.slice(4,8)];
  if(top.length < 5) top.push(...pool.filter(v=>!top.includes(v)).slice(0, 5-top.length));
  return [{name:'이어서 시청하기', items:cont, progress:[62,30,80,45]}, {name:'오늘의 TOP 5', top:true, items:top}, ...rows];
};
const rowsNow = () => autoRows(PROFILES[PROFILE] || []);
const ALL = () => [HERO, ...Object.values(PROFILES).flat().flatMap(r=>r.items)];
const find = id => ALL().find(v=>v.id===id);
const art = v => `background:${v.thumb?`url('${v.thumb}') center/cover no-repeat,`:''}radial-gradient(circle at 75% 25%,hsl(${v.hue} 80% 70% / .55),transparent 45%),linear-gradient(135deg,hsl(${v.hue} 45% 28%),hsl(${(v.hue+40)%360} 40% 12%))`;
const $ = id => document.getElementById(id);
const jjim = new Set();
const rowOf = v => rowsNow().find(r=>!r.top && !r.progress && r.items.includes(v));
const eps = v => { const r = rowOf(v); if(!r) return ''; return `<h4 style="margin:22px 0 0">${r.name}</h4><ul class="eps">${r.items.map((e,i)=>`<li data-play="${e.id}"><span class="no">${i+1}</span><span class="th" style="${art(e)}"></span><span><b>${e.title}</b><small>${[e.len,e.desc].filter(Boolean).join(' · ')||e.ep}</small></span></li>`).join('')}</ul>`; };
const SPR = {
  kyoo:[`....................`,`....................`,`.................Q..`,`..QQ..QQ.........QQ.`,`..QQQQQQ..........Q.`,`Q.QQQQQQ.Q.......QQ.`,`.QQQQQQQQQ.......Q..`,`..QQQQQQQ.......QQ..`,`...QQQQQQQQQQQQQQ...`,`....QQQQQQQQQQQQQ...`,`....QQQQQQQQQQQQQ...`,`....QQQQQQQQQQQQQ...`,`.....QQQQQQQQQQQQ...`,`.....QQQQQQQQQQQQ...`,`.....QQQQQ..QQQQQQ..`,`.....QQ.QQ..QQ..QQ..`,`.....QQ.Q...QQ...Q..`,`....QQ.QQ..QQ...QQ..`,`....................`,`....................`],
  fan:[`....................`,`....................`,`.......iiiiii.......`,`......ihhhhhhi......`,`......hhhqqhhh......`,`.....r9hhhhhh9r.....`,`....rnn9hhhh9xxr....`,`...rnnnn9999xxxxr...`,`...rnnnnnnnnxxxxr...`,`...rrnnnnnnnnxxrr...`,`....rrrrrrrrrrrr....`,`...yyyyyyyyyyyyyy...`,`...yyyyyyyyyyyyyy...`,`...yyyeeeeyyeyyyy...`,`...yyeeEeeeeeyyyy...`,`...yyyeeeeyyeyyyy...`,`...yyyyyyyyyyyyyy...`,`...99999999999999...`,`....................`,`....................`],
  cake:[`................`,`.......F........`,`......FfF.......`,`.......C........`,`.......C........`,`...WWWWWWWWWW...`,`..WPWWPWWPWWPW..`,`..WWWWWWWWWWWW..`,`..AAAAAAAAAAAA..`,`..AAAAAAAAAAAA..`,`..PPPPPPPPPPPP..`,`..AAAAAAAAAAAA..`,`..AAAAAAAAAAAA..`,`.TTTTTTTTTTTTTT.`,`................`,`................`],
  gift:[`................`,`................`,`.....RR..RR.....`,`....R..RR..R....`,`.....RRRRRR.....`,`..WWWWWRRWWWWW..`,`..WWWWWRRWWWWW..`,`...wwwwRRwwww...`,`...wwwwRRwwww...`,`...wwwwRRwwww...`,`...RRRRRRRRRR...`,`...wwwwRRwwww...`,`...wwwwRRwwww...`,`...wwwwRRwwww...`,`................`,`................`]
};
const PAL = {K:'#2b2220',S:'#f3c9a8',E:'#1a1414',B:'#f2a0a0',M:'#c0605c',W:'#ffffff',w:'#eef0f4',G:'#8d8a90',D:'#3a3a3a',H:'#6b3e26',Y:'#fff3a6',L:'#9a9a9a',F:'#ffb13b',f:'#ffe27a',C:'#ffffff',A:'#f6d9a8',P:'#ffb3c4',T:'#dcdce2',R:'#f2c14e',N:'#7b787e',J:'#3b4352',t:'#c9a77c',O:'#151515',V:'#dfe3ea',k:'#c3c8cf',Q:'#19171b',g:'#c6e04a',1:'#c7ccd3',2:'#e9edf2',3:'#aeb4bd',4:'#ffffff',5:'#2fb3a5',6:'#d6f1ff',7:'#9aa0a8',o:'#f0a05a',u:'#fbfaf7',b:'#7fbff0',d:'#4f93d6',l:'#e3f3ff',m:'#f29a9a',z:'#4a2a10',r:'#d9a54a',9:'#a8752a',n:'#f08a6c',x:'#c9604a',h:'#cdb488',i:'#e6d3a6',q:'#b39a6c',y:'#1f3a1c',e:'#e9e7a6'};
const sprite = m => `<svg viewBox="0 0 ${m[0].length} ${m.length}" width="72%" height="72%" shape-rendering="crispEdges" aria-hidden="true">${m.flatMap((row,y)=>[...row].map((c,x)=>PAL[c]?`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`:'')).join('')}</svg>`;
document.querySelectorAll('.prof i[data-s]').forEach(i=>{ i.innerHTML = sprite(SPR[i.dataset.s]); });
document.querySelectorAll('.prof').forEach(b=>b.addEventListener('click',()=>{
  const me=document.querySelector('.me'); me.style.background=b.dataset.c; me.innerHTML=b.querySelector('i').innerHTML;
  PROFILE = b.querySelector('i').dataset.s; renderRows(); scrollTo(0,0);
  $('who').classList.add('hidden');
}));
document.querySelector('.me').addEventListener('click',()=>{ $('who').style.animation='none'; $('who').classList.remove('hidden'); });

function renderRows(){
$('rows').innerHTML = rowsNow().map((r,ri)=>`
  <section class="row ${r.top?'top':''}">
    <h2>${r.name}</h2>
    <div class="rail">
      <button class="arrow l" data-r="${ri}" data-d="-1" aria-label="이전">‹</button>
      <div class="track" id="t${ri}">${r.items.map((v,i)=> r.top
        ? `<button class="card" data-id="${v.id}" style="${art(v)}"><span class="num">${i+1}</span><span class="poster" style="${art(v)}"><span class="t">${v.title}</span></span></button>`
        : `<button class="card" data-id="${v.id}" style="${art(v)}"><span class="ep">${v.ep}</span><span class="t">${v.title}</span>${r.progress?`<span class="bar" style="width:${r.progress[i]}%"></span>`:''}</button>`).join('')}</div>
      <button class="arrow r" data-r="${ri}" data-d="1" aria-label="다음">›</button>
    </div>
  </section>`).join('');
}
renderRows();

document.addEventListener('click', e=>{
  const j = e.target.closest('.jj');
  if(j){ const id=j.dataset.id; jjim.has(id)?jjim.delete(id):jjim.add(id); document.querySelectorAll(`.jj[data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',jjim.has(id)); b.textContent=jjim.has(id)?'✓':'＋';}); return; }
  const ep = e.target.closest('[data-play]'); if(ep){ play(ep.dataset.play); return; }
  const a = e.target.closest('.arrow');
  if(a){ const t=$('t'+a.dataset.r); t.scrollBy({left:a.dataset.d*t.clientWidth*.85,behavior:'smooth'}); return; }
  const c = e.target.closest('.card'); if(c) openSheet(c.dataset.id);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(!$('player').classList.contains('hidden')) closePlayer(); else closeSheet(); }
  const t = document.activeElement.closest?.('.track');
  if(t && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); t.scrollBy({left:(e.key==='ArrowRight'?1:-1)*t.clientWidth*.85,behavior:'smooth'}); }
});

// header solid on scroll
const head = $('top');
addEventListener('scroll', ()=>head.classList.toggle('solid', scrollY>40), {passive:true});

// hero
function renderHero(){
  if(HERO.src){
    const art0 = $('heroMedia').innerHTML;
    $('heroMedia').innerHTML = `<video id="heroVid" src="${HERO.src}" autoplay muted loop playsinline></video>`;
    $('heroVid').onerror = ()=>{ $('heroMedia').innerHTML = art0; };
    $('heroVid').play().catch(()=>{});
  }
}
$('heroPlay').onclick = ()=>play(HERO.id);
$('heroMore').onclick = ()=>openSheet(HERO.id);
$('mute').onclick = ()=>{
  const v = $('heroVid'); if(!v) return;
  v.muted = !v.muted; $('mute').textContent = v.muted?'🔇':'🔊';
  $('mute').setAttribute('aria-label', v.muted?'소리 켜기':'소리 끄기');
};

// detail sheet
let lastFocus = null;
function openSheet(id){
  const v = find(id); lastFocus = document.activeElement;
  $('sheet').innerHTML = `
    <div class="cover" style="${art(v)}">
      <button class="x" id="x" aria-label="닫기">✕</button>
      <div><h3>${v.title}</h3><div class="acts"><button class="btn play" id="sp">▶ 재생</button><button class="btn more jj ${jjim.has(v.id)?'on':''}" data-id="${v.id}" aria-label="찜하기">${jjim.has(v.id)?'✓':'＋'}</button></div></div>
    </div>
    <div class="body">
      <div class="meta"><b>생일 특집</b><span>2026</span><span class="age" style="padding:0 6px;border:1px solid #ffffff55;background:none">ALL</span>${v.len?`<span>${v.len}</span>`:''}<span>${v.yt?'YouTube':'HD'}</span></div>
      ${v.desc?`<p>${v.desc}</p>`:''}
      ${eps(v)}
    </div>`;
  $('overlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
  $('x').onclick = closeSheet; $('sp').onclick = ()=>play(id); $('x').focus();
}
function closeSheet(){
  $('overlay').classList.add('hidden'); document.body.style.overflow='';
  lastFocus?.focus?.();
}
$('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

// player
function play(id){
  const v = find(id);
  $('pbody').innerHTML = v.yt
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&playsinline=1&rel=0" title="${v.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a class="ytout" href="https://youtu.be/${v.yt}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>`
    : v.src
    ? `<video src="${v.src}" controls autoplay playsinline></video>`
    : `<div class="empty"><b>${v.title}</b>영상을 준비 중이에요.</div>`;
  $('player').classList.remove('hidden');
  const hv = $('heroVid'); if(hv) hv.pause();
  const pv = $('pbody').querySelector('video');
  if(pv){
    pv.onerror = ()=>{ $('pbody').innerHTML = `<div class="empty"><b>${v.title}</b>영상을 준비 중이에요.</div>`; };
    pv.play().catch(()=>{}); pv.requestFullscreen?.().catch(()=>{});
  }
  $('back').focus();
}
function closePlayer(){
  const pv = $('pbody').querySelector('video'); if(pv) pv.pause();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('player').classList.add('hidden'); $('pbody').innerHTML='';
  const hv = $('heroVid'); if(hv) hv.play().catch(()=>{});
}
$('back').onclick = closePlayer;
renderHero();
}
</script>
