<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYOOFLIX</title>
<meta name="description" content="11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.">
<meta property="og:title" content="KYOOFLIX">
<meta property="og:description" content="11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.">
<meta property="og:image" content="https://kyooflix.github.io/thumbs/main.jpg">
<meta property="og:url" content="https://kyooflix.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a birthday streaming service, polished like a shipped app, warm not cold
   IDEA: an OTT home screen whose whole catalogue is one actor's birthday
   PICTURE: full-bleed hero "now playing" with rows of posters below
   COLOUR and TYPE: near-black ground, kyoo-pink accent; Black Han Sans logo, IBM Plex Sans KR, Gowun Batang titles
   LAYOUT: fixed top bar, hero 70vh, horizontal snap rows, detail sheet and full-screen player */
:root{color-scheme:dark;--bg:#0b0a0c;--panel:#18161a;--ink:#f5f2f3;--soft:#a8a2a6;--rose:#f2c14e;--gold:#ffd27a}
*{box-sizing:border-box;min-width:0}
body{margin:0;word-break:keep-all;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,label:focus-within{outline:2px solid var(--rose);outline-offset:3px}
.hidden{display:none!important}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;animation:introOut .6s 2.1s forwards}
#intro .logo{font:400 clamp(64px,16vw,160px)/1 "Bebas Neue",sans-serif;color:var(--rose);letter-spacing:.02em;text-shadow:0 0 40px #f2c14e55;animation:logoIn 1.8s ease both}
#intro .logo span{color:var(--ink)}
@keyframes logoIn{0%{opacity:0;transform:scale(.8);filter:blur(10px)}50%{opacity:1;filter:none}100%{transform:scale(1.08)}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

/* top bar */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:24px;padding:14px max(4vw,16px);background:linear-gradient(rgba(11,10,12,.85),transparent);transition:background .3s}
header.solid{background:rgba(11,10,12,.97)}
.brand{font:400 34px/1 "Bebas Neue",sans-serif;letter-spacing:.02em;color:var(--rose);flex:none}.brand span{color:var(--ink)}
nav{display:flex;gap:18px;font-size:14px;color:var(--soft);overflow-x:auto;scrollbar-width:none}
nav a{color:inherit;text-decoration:none;white-space:nowrap}nav a.on{color:var(--ink);font-weight:700}
.swap{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:#f2c14e;cursor:pointer;flex:none}
.swap .me{animation:swpulse 2s ease-out 1.2s 4}
.swap:hover .me{filter:brightness(1.12)}.swap .chev{animation:swbob 1.4s ease-in-out infinite}
@keyframes swpulse{0%{box-shadow:0 0 0 0 #f2c14eaa}100%{box-shadow:0 0 0 10px #f2c14e00}}
@keyframes swbob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.me{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--rose),var(--gold));flex:none}

/* hero */
.hero{position:relative;height:min(78vh,720px);min-height:460px;display:flex;align-items:flex-end;padding:0 max(4vw,16px) clamp(40px,8vh,90px);overflow:hidden}
.hero .media{position:absolute;inset:0}
.hero video{width:100%;height:100%;object-fit:cover}
.hero .art{position:absolute;inset:-10%;background:radial-gradient(circle at 70% 40%,#f2c14e33,transparent 40%),radial-gradient(circle at 30% 70%,#ffffff12,transparent 45%),linear-gradient(120deg,#141416,#2a292e 45%,#0b0a0c);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg)),linear-gradient(90deg,rgba(11,10,12,.85),transparent 60%);pointer-events:none}
.hero .info{position:relative;z-index:1;max-width:560px}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero h1{letter-spacing:-.03em;font:900 clamp(36px,7vw,64px)/1.22 "Noto Sans KR",sans-serif;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0 0 20px;color:#e6d6d0;max-width:46ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:10px 22px;border-radius:6px;border:0;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.play{background:var(--ink);color:var(--bg)}
.btn.more{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.rate{position:absolute;right:0;bottom:clamp(40px,8vh,90px);z-index:1;display:flex;align-items:center;gap:12px}.mute{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff66;background:transparent}.age{background:#ffffff1f;border-left:3px solid var(--ink);padding:6px 28px 6px 10px;font-size:14px}
.jj{padding:10px 16px}.jj.on{background:var(--rose);color:var(--bg)}
.eps{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid #ffffff1a}.eps li{display:grid;grid-template-columns:28px 120px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff1a;cursor:pointer}.eps .no{font-size:22px;color:var(--soft);text-align:center}.eps .th{aspect-ratio:16/9;border-radius:4px}.eps b{display:block;font-size:15px}.eps small{color:var(--soft)}
@media(max-width:600px){.eps li{grid-template-columns:22px 90px 1fr}}
#who{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
@keyframes fadein{from{opacity:0}}
#who h2{font-size:clamp(26px,5vw,44px);font-weight:500;margin:0}
.profs{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vw,28px)}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--soft);font-size:15px}
.prof i{display:grid;place-items:center;width:clamp(84px,14vw,140px);aspect-ratio:1;border-radius:8px;font:500 clamp(28px,4.5vw,44px)/1 "Noto Sans KR",system-ui,sans-serif;color:#fff;border:3px solid transparent;transition:border-color .15s}
.prof:hover,.prof:focus-visible{color:var(--ink)}.prof:hover i,.prof:focus-visible i{border-color:var(--ink)}

/* rows */
.rows{position:relative;z-index:2;margin-top:-40px;padding-bottom:60px}
.row{margin-bottom:34px}
.row h2{font-size:20px;margin:0 0 10px;padding:0 max(4vw,16px)}
.rail{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 max(4vw,16px);padding:6px max(4vw,16px) 12px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:clamp(240px,31vw,420px);aspect-ratio:16/9;border-radius:8px;scroll-snap-align:start;position:relative;overflow:hidden;border:0;padding:0;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:scale(1.05);box-shadow:0 12px 30px #0009;z-index:2}
.card .t{position:absolute;left:10px;right:10px;bottom:8px;font-weight:700;font-size:14px;line-height:1.3;text-shadow:0 1px 6px #000a}
.card .ep{position:absolute;left:10px;top:8px;font-size:12px;color:#fff;background:#0007;padding:2px 7px;border-radius:4px}
.card .bar{position:absolute;left:0;bottom:0;height:4px;background:#e8333a}
.top .card{width:clamp(250px,34vw,440px);display:flex;align-items:stretch;background:none!important}
.top .num{font:700 clamp(90px,13vw,150px)/.8 "Noto Sans KR",sans-serif;color:var(--bg);-webkit-text-stroke:2px #8c7279;align-self:flex-end;margin-right:-14px;position:relative;z-index:1}
.top .poster{flex:1;border-radius:8px;position:relative;overflow:hidden;aspect-ratio:2/3;max-width:60%}
.arrow{position:absolute;top:6px;bottom:12px;width:max(4vw,40px);border:0;background:rgba(11,10,12,.6);font-size:28px;z-index:3;opacity:0;transition:opacity .2s}
.rail:hover .arrow,.arrow:focus-visible{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}

/* detail sheet */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;overflow-y:auto}
.sheet{width:min(880px,100%);background:var(--panel);border-radius:12px;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
.sheet .cover{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:clamp(18px,4vw,40px);overflow:hidden}
.sheet .cover>.media{position:absolute;inset:0;z-index:0}
.sheet .cover>.x{position:absolute;top:14px;right:14px;z-index:3}
.sheet .cover .media video,.sheet .cover .media iframe{width:100%;height:100%;object-fit:cover;border:0;pointer-events:none}
.sheet .cover .media video{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px)}
.sheet .cover .media iframe{transform:scale(1.35)}
.sheet .cover .row2{display:flex;align-items:center;gap:10px;width:100%}
.sheet .cover .snd{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid #ffffff88;background:#0005;font-size:16px}
.sheet .two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px}
.sheet .side p{margin:0 0 10px;font-size:14px}.sheet .side span{color:var(--soft)}
@media(max-width:600px){.sheet .two{grid-template-columns:minmax(0,1fr);gap:8px}}
.sheet .cover::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(transparent 45%,var(--panel))}
.sheet .cover>*{position:relative;z-index:1}
.sheet h3{letter-spacing:-.02em;font:900 clamp(26px,5vw,40px)/1.1 "Noto Sans KR",sans-serif;margin:0 0 14px}
.sheet .body{padding:6px clamp(18px,4vw,40px) 30px}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--soft);margin-bottom:10px}
.meta b{color:#7ee0a0}
.x{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:#000a;font-size:20px}
.upl{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:6px;border:1px dashed #ffffff55;font-size:14px;color:var(--soft);cursor:pointer;position:relative}
.upl input{position:absolute;opacity:0;width:1px;height:1px}

/* player */
#player{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center}
#pbody{position:absolute;inset:0;display:grid;place-items:center}
#player video{width:100%;height:100%;object-fit:contain}
#player iframe{width:min(100%,calc(100vh*16/9));height:auto;aspect-ratio:16/9;border:0}
  .sheet .cover>div:not(.media){pointer-events:none}.sheet .cover .row2>*{pointer-events:auto}
  .sheet .cover>.tapplay{position:absolute;inset:0;z-index:1;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.sheet .cover>.tapplay:not(.show){opacity:0;pointer-events:none}.sheet .cover>.tapplay{transition:opacity .3s}
.tapplay span{width:64px;height:64px;border-radius:50%;background:#000a;border:2px solid #ffffffcc;display:grid;place-items:center;font-size:24px;padding-left:4px}
#player .unmute{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:2;min-height:44px;padding:10px 20px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;box-shadow:0 6px 20px #0008}
#player .ytout{position:absolute;top:16px;right:16px;z-index:2;min-height:44px;display:inline-flex;align-items:center;padding:8px 16px;border-radius:6px;background:#ffffff22;color:var(--ink);text-decoration:none;font-size:14px}
#player .empty{text-align:center;color:var(--soft);padding:20px}
#player .empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
#player .back{position:absolute;top:16px;left:16px;z-index:2;min-height:44px;padding:8px 16px;border-radius:6px;border:0;background:#ffffff22}
footer{padding:20px max(4vw,16px) 40px;color:var(--soft);font-size:13px}
/* hover preview */
#pop{position:absolute;z-index:25;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px #000c;transform-origin:center;animation:popin .18s ease-out}
@keyframes popin{from{opacity:0;transform:scale(.88)}}
#pop .pv{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:12px 14px;overflow:hidden}
.ytv{opacity:0;transition:opacity .6s}.ytv.on{opacity:1}
/* 유튜브로 열리는 카드 표시 */
.ytb{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#000b;color:#fff;letter-spacing:.01em}
#pop .pvbg{position:absolute;inset:0;transform-origin:center}
#pop .pv video{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:cover}
.fv{opacity:0;transition:opacity .6s ease}.fv.on{opacity:1}
#pop .pv b{position:relative;font-size:17px;text-shadow:0 1px 8px #000c}
#pop .pb{padding:12px 14px 14px}
#pop .ic{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#pop .ic button{width:38px;height:38px;border-radius:50%;border:1.5px solid #ffffff66;background:transparent;display:grid;place-items:center;font-size:15px;padding:0}
#pop .ic .pl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#pop .ic .lk.on{border-color:var(--rose);color:var(--rose)}
#pop .ic .mo{margin-left:auto}
#pop .mt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
#pop .mt .ag{border:1px solid #ffffff55;padding:0 5px;border-radius:3px;font-size:12px}
#pop .ds{margin:8px 0 0;font-size:13px;color:#ddd;overflow-wrap:anywhere}
.rt{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:4px;font:900 12px/1 'Noto Sans KR',sans-serif;color:#111}
.rALL{background:#3fbf6f}.r12{background:#f2c14e}.r15{background:#f08a3c}.r17{background:#e8673a}.r19{background:#e0453a;color:#fff}
.sheet .meta{align-items:center}
.sheet .credit{font-size:13px;color:var(--soft);margin:4px 0 0}
.sheet .desc{font-size:16px;line-height:1.7;margin:12px 0 0;overflow-wrap:anywhere}
@media (hover:none){#pop{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#intro{display:none}}
@media (max-width:600px){header{gap:14px}.hero{min-height:420px}.arrow{display:none}
  nav{display:none}
  .hero .info{padding-bottom:4px}
  .rate{top:70px;bottom:auto;right:0}
  .profs{display:grid;grid-template-columns:repeat(2,auto);justify-content:center;gap:22px 28px}
  .card{width:min(68vw,300px)}
  .top .card{width:min(72vw,300px)}
}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="logo">KYOO<span>FLIX</span></div></div>

<div id="who" role="dialog" aria-label="프로필 선택">
  <h2>누구로 볼까요?</h2>
  <div class="profs">
    <button class="prof" data-c="#f2c14e"><i data-s="kyoo" style="background:linear-gradient(135deg,#c8902a,#f2c14e)"></i>뀨</button>
    <button class="prof" data-c="#8fe0b0"><i data-s="gift" style="background:linear-gradient(135deg,#2fa36b,#8fe0b0)"></i>290</button>
    <button class="prof" data-c="#b9a3ff"><i data-s="fan" style="background:linear-gradient(135deg,#6c4fd0,#b9a3ff)"></i>뀨러기</button>
    <button class="prof" data-c="#7fb8ff"><i data-s="cake" style="background:linear-gradient(135deg,#3d7be0,#7fb8ff)"></i>규자보이</button>
  </div>
</div>

<header id="top">
  <div class="brand">KYOO<span>FLIX</span></div>
  <nav><a class="on" href="#">홈</a><a href="#">시리즈</a><a href="#">필모그래피</a><a href="#">비하인드</a><a href="#">내가 찜한 영상</a></nav>
  <button class="swap" aria-label="프로필 바꾸기"><span class="me"></span><svg class="chev" viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>

<section class="hero">
  <div class="media" id="heroMedia"><div class="art"></div></div>
  <div class="info">
    <div class="tag">KYOOFLIX 오리지널 · 생일 특집</div>
    <h1 id="heroTitle">Happy Birthday,<br>이규형</h1>
    <p id="heroDesc">11월 29일, 단 하루만 공개되는 특별 편성. 생일을 맞은 '배우 이규형' 탐구 프로젝트.</p>
    <div class="acts">
      <button class="btn play" id="heroPlay">▶ 재생</button>
      <button class="btn more" id="heroMore">ⓘ 상세 정보</button>
      <button class="btn more jj" data-id="v0" aria-label="찜하기">＋</button>
    </div>
  </div>
  <div class="rate"><button class="mute" id="mute" aria-label="소리 켜기">🔇</button><span class="age">ALL</span></div>
</section>

<div class="rows" id="rows"></div>
<footer>Made by @demzigetda · 배우 이규형 생일 축하 비공식 팬메이드 페이지</footer>

<div id="pop" class="hidden"></div>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div id="player" class="hidden"><button class="back" id="back">← 뒤로</button><div id="pbody"></div></div>

<script>
{
const hues = [18,210,38,265,170,25,195,45,230,12];
let n = 0;
function file(title, ep, desc, len, src, thumb){ return {id:'v'+(n++), title, ep, desc, len, src, thumb, hue:hues[n%hues.length]}; }
const ytSrc = (id, mute) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=${mute}&controls=0&loop=1&playlist=${id}&playsinline=1&rel=0&modestbranding=1&enablejsapi=1`;
// ytx(): 페이지 안에서 틀지 않고 누르면 유튜브(앱/사이트)로 바로 열리는 영상
function ytx(url, title){ return Object.assign(yt(url, title, true), {ext:true}); }
const ytUrl = v => `https://youtu.be/${v.yt}`;
function openYT(v){ const w = window.open(ytUrl(v), '_blank'); if(w){ try{ w.opener = null; }catch(e){} } else location.href = ytUrl(v); }
// 세 번째에 true를 주면 원래 썸네일을 살짝 확대해서 가장자리 테두리를 잘라내요
function yt(url, title, crop){
  const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  const y = m ? m[1] : '';
  return {id:'v'+(n++), title, ep:'YouTube', desc:'', len:'', yt:y, thumb: y?`https://i.ytimg.com/vi/${y}/hqdefault.jpg`:'', crop:!!crop, hue:hues[n%hues.length]};
}
// ============================================================
//  여기만 고치면 돼요 ✏️
//  내 영상: file('제목','회차','설명','길이','videos/파일.mp4','thumbs/썸네일.jpg')
//  유튜브:  yt('유튜브 링크','제목')   ← 링크만 붙여넣으면 썸네일은 자동
// ============================================================

// ── 공통 메인 영상 (모든 프로필 맨 위)
const HERO = file('Happy Birthday, 이규형','메인','11월 29일 특별 편성 메인 영상.','1분 27초','videos/main.mp4','thumbs/main.jpg');
HERO.credit = 'Gen Hoshino - Suki';

// ── 내 영상 파일들
const FACE = [
  file('조강화 얼굴','작품 1','','35초','videos/face1.mp4','thumbs/face1.jpg'),
  file('이승영 얼굴','작품 2','','11초','videos/face2.mp4','thumbs/face2.jpg'),

  for(let i=0;i<max;i++) rows.forEach(r=>{ const v=r.items[i]; if(v && (v.src||v.yt)) pool.push(v); });  // 아직 비어 있는 칸은 이어보기에 안 넣음
  return [{name:'이어서 시청하기', items:pool.slice(0,4), progress:[62,30,80,45]}, {name:'오늘의 TOP 7', top:true, items:TOP7}, ...rows];
};

          <button class="btn play" id="sp">${v.ext?'▶ 유튜브에서 보기':'▶ 재생'}</button>
          <button class="btn more jj ${jjim.has(v.id)?'on':''}" data-id="${v.id}" aria-label="찜하기">${jjim.has(v.id)?'✓':'＋'}</button>
          <button class="btn more" id="lk2" aria-label="좋아요">${liked.has(v.id)?'♥':'♡'}</button>
          ${media?`<button class="snd" id="snd" aria-label="소리 켜기">🔇</button>`:''}
        </div></div>
    </div>
    <div class="body"><div class="two">
      <div>
        <div class="meta"><span>${v.year||'2026'}</span>${v.len?`<span>${v.len}</span>`:''}<span class="age" style="padding:0 6px;border:1px solid #ffffff55;background:none">HD</span>${rate(v.age)}</div>
        ${v.desc?`<p class="desc">${v.desc}</p>`:''}${v.credit?`<p class="credit">${v.credit}</p>`:''}
      </div>
      <div class="side">${side}</div>
    </div></div>`;
  $('overlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
  revealYT($('sheet'));
  const tp = $('tapplay'), cvf = $('cv');
  if(tp && cvf){
    tp.onclick = ()=>{ ytCmd(cvf,'unMute'); ytCmd(cvf,'playVideo'); cvf.dataset.m='0'; cvf.classList.add('on'); tp.remove(); if($('snd')) $('snd').textContent='🔊'; };
    cvf.addEventListener('ytplaying', ()=>{ if(tp.isConnected) tp.remove(); });
    setTimeout(()=>{ if(tp.isConnected) tp.classList.add('show'); }, 1500);
  }
  const hv = $('heroVid'); if(hv) hv.pause();
  $('x').onclick = closeSheet; $('sp').onclick = ()=>{ stopCover(); play(id); }; $('x').focus();
  $('lk2').onclick = ()=>{ liked.has(id)?liked.delete(id):liked.add(id); $('lk2').textContent = liked.has(id)?'♥':'♡'; };
  if($('snd')) $('snd').onclick = ()=>{
    const c = $('cv'); if(!c) return;
    let muted;
    if(c.tagName==='VIDEO'){ c.muted = !c.muted; muted = c.muted; }
    else { c.dataset.m = c.dataset.m==='0' ? '1' : '0'; muted = c.dataset.m!=='0'; ytCmd(c, muted?'mute':'unMute'); ytCmd(c,'playVideo'); c.classList.add('on'); }
    $('snd').textContent = muted?'🔇':'🔊';
  };
}
// 유튜브 제목·버튼이 사라진 뒤에 영상을 보여줌 (그 전엔 썸네일)
const rate = a => a ? `<span class="rt r${a}">${a}</span>` : '';
function revealYT(root){ const f = root.querySelector('iframe.ytv'); if(f) ytListen(f); }
// 유튜브 플레이어와 대화하기 (재생 중인지 알아내고, 소리 켜기/끄기 명령 보내기)
function ytPost(f, msg){ try{ f.contentWindow.postMessage(JSON.stringify(msg), '*'); }catch(e){} }
function ytCmd(f, func){ ytPost(f, {event:'command', func, args:[]}); }
function ytListen(f){
  const hello = ()=>ytPost(f, {event:'listening', id:'kyoo', channel:'widget'});
  f.addEventListener('load', ()=>{ hello(); setTimeout(hello, 600); setTimeout(hello, 1500); setTimeout(()=>ytCmd(f,'playVideo'), 300); });
}
addEventListener('message', e=>{
  if(!/youtube/.test(String(e.origin))) return;
  let d; try{ d = typeof e.data==='string' ? JSON.parse(e.data) : e.data; }catch(_){ return; }
  if(!d) return;
  const st = d.event==='onStateChange' ? d.info : (d.info && d.info.playerState);
  if(st!==1) return;   // 1 = 재생 중
  document.querySelectorAll('iframe').forEach(f=>{
    if(f.contentWindow!==e.source || f.dataset.playing) return;
    f.dataset.playing = '1'; f.dispatchEvent(new Event('ytplaying'));
    if(f.classList.contains('ytv')) setTimeout(()=>f.classList.add('on'), 700);
  });
});
function stopCover(){ const c=$('cv'); if(c){ if(c.tagName==='VIDEO') c.pause(); c.remove(); } }
function closeSheet(){
  stopCover(); const hv = $('heroVid'); if(hv && $('player').classList.contains('hidden')) hv.play().catch(()=>{});
  $('overlay').classList.add('hidden'); document.body.style.overflow='';
  lastFocus?.focus?.();
}
$('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

// player
function play(id){
  const v = find(id), touch = matchMedia('(hover:none)').matches;
  if(v.ext){ openYT(v); return; }
  $('pbody').innerHTML = v.yt
    ? `<iframe id="pyt" src="https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&mute=${touch?1:0}&playsinline=1&rel=0&enablejsapi=1" title="${v.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>${touch?'<button class="unmute" id="unm">▶ 눌러서 재생</button>':''}<a class="ytout" href="https://youtu.be/${v.yt}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>`
    : v.src
    ? `<video src="${v.src}" controls autoplay playsinline></video>`
    : `<div class="empty"><b>${v.title}</b>영상을 준비 중이에요.</div>`;
  $('player').classList.remove('hidden');
  const hv = $('heroVid'); if(hv) hv.pause();
  const pv = $('pbody').querySelector('video');
  if(pv){
    pv.onerror = ()=>{ $('pbody').innerHTML = `<div class="empty"><b>${v.title}</b>영상을 준비 중이에요.</div>`; };
    pv.play().catch(()=>{}); pv.requestFullscreen?.().catch(()=>{});
  }
  const pf = $('pyt');
  if(pf){
    ytListen(pf); const u = $('unm');
    if(u){
      u.onclick = ()=>{ ytCmd(pf,'unMute'); ytCmd(pf,'playVideo'); u.remove(); };
      pf.addEventListener('ytplaying', ()=>{ if(u.isConnected) u.textContent = '🔊 눌러서 소리 켜기'; });
    }
  }
  $('back').focus();
}
function closePlayer(){
  const pv = $('pbody').querySelector('video'); if(pv) pv.pause();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('player').classList.add('hidden'); $('pbody').innerHTML='';
  const hv = $('heroVid'); if(hv) hv.play().catch(()=>{});
}
$('back').onclick = closePlayer;
renderHero();

// ── 카드에 마우스 올리면 뜨는 미리보기
const liked = new Set();
let popT = null, popFor = null;
const pop = $('pop');
function hidePop(){ clearTimeout(popT); popFor=null; pop.classList.add('hidden'); pop.innerHTML=''; }
function showPop(card){
  const v = find(card.dataset.id); if(!v) return;
  const r = card.getBoundingClientRect();
  const w = Math.min(Math.max(r.width*1.3, 300), innerWidth-24);
  const left = Math.min(Math.max(r.left + r.width/2 - w/2, 12), innerWidth - w - 12);
  const top = Math.max(r.top + scrollY - r.height*.3, scrollY + 70);
  pop.style.cssText = `left:${left}px;top:${top}px;width:${w}px`;
  pop.innerHTML = `
    <div class="pv"><div class="pvbg" style="${art(v)}"></div>${v.yt&&!v.ext?`<iframe src="${ytSrc(v.yt,1)}" allow="autoplay; encrypted-media" tabindex="-1" title="" class="ytv" style="position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;transform:scale(1.35)"></iframe>`:v.src?`<video src="${v.src}" class="fv" onplaying="setTimeout(()=>this.classList.add('on'),700)" muted autoplay loop playsinline onerror="this.remove()"></video>`:''}<b>${v.title}</b></div>
    <div class="pb">
      <div class="ic">
        <button class="pl" data-a="play" aria-label="재생">▶</button>
        <button class="jj ${jjim.has(v.id)?'on':''}" data-id="${v.id}" aria-label="찜하기">${jjim.has(v.id)?'✓':'＋'}</button>
        <button class="lk ${liked.has(v.id)?'on':''}" data-a="like" aria-label="좋아요">${liked.has(v.id)?'♥':'♡'}</button>
        <button class="mo" data-a="more" aria-label="상세 정보"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
      </div>
      <div class="mt"><span>${v.type||'생일 특집'}</span>${rate(v.age)}${v.len?`<span>${v.len}</span>`:''}<span class="ag">HD</span></div>
      ${v.tags?`<p class="ds">${v.tags}</p>`:''}
    </div>`;
  popFor = v.id; pop.classList.remove('hidden');
  revealYT(pop);
}
document.addEventListener('mouseover', e=>{
  if(!matchMedia('(hover:hover)').matches) return;
  const c = e.target.closest('.card');
  if(c && c.dataset.id!==popFor){ clearTimeout(popT); popT = setTimeout(()=>showPop(c), 450); }
  if(!c && !e.target.closest('#pop')) hidePop();
});
pop.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !popFor) return;
  e.stopPropagation();
  const id = popFor;
  if(b.dataset.a==='play'){ hidePop(); const pv = find(id); if(pv.ext) openYT(pv); else play(id); }
  else if(b.dataset.a==='more'){ hidePop(); openSheet(id); }
  else if(b.dataset.a==='like'){ liked.has(id)?liked.delete(id):liked.add(id); b.classList.toggle('on',liked.has(id)); b.textContent=liked.has(id)?'♥':'♡'; }
  else if(b.classList.contains('jj')){ jjim.has(id)?jjim.delete(id):jjim.add(id); document.querySelectorAll(`.jj[data-id="${id}"]`).forEach(x=>{x.classList.toggle('on',jjim.has(id)); x.textContent=jjim.has(id)?'✓':'＋';}); }
});
addEventListener('scroll', hidePop, {passive:true});
document.querySelectorAll('.track').forEach(t=>t.addEventListener('scroll', hidePop, {passive:true}));
}
</script>
</body>
</html>
